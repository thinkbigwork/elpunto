<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libro de El Punto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Libro de documentación: barra lateral por categorías, página central de lectura, índice de la página a la derecha. */
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --ink: #151513;
  --muted: #5d5d57;
  --rule: #e1e1dc;
  --soft: #eeeeea;
  --link: #2c47c9;
  --dot-bg: #0b0b0a;
  --dot: #f2f1ec;
  --mark: rgba(44, 71, 201, 0.10);
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: 272px;
  --toc: 208px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0c; --surface: #141413; --ink: #ecebe6; --muted: #a2a19a; --rule: #2a2a27; --soft: #1c1c1a;
    --link: #9fb0ff; --dot-bg: #f2f1ec; --dot: #0b0b0a; --mark: rgba(159, 176, 255, 0.14); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0c; --surface: #141413; --ink: #ecebe6; --muted: #a2a19a; --rule: #2a2a27; --soft: #1c1c1a;
  --link: #9fb0ff; --dot-bg: #f2f1ec; --dot: #0b0b0a; --mark: rgba(159, 176, 255, 0.14); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.65 var(--font-body); }
a { color: var(--link); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }

/* ── barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; min-width: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--dot-bg); display: grid; place-items: center; flex: none; }
.brand-mark span { width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
.brand-name { font: italic 600 22px/1 var(--font-display); white-space: nowrap; }
.brand-sub { font: 500 11px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.search { margin-left: auto; position: relative; flex: 0 1 320px; min-width: 0; }
.search input { width: 100%; font: 400 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px 7px 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); }
.menu-btn { display: none; background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: 500 13px var(--font-body); cursor: pointer; }

/* ── estructura */
.layout { display: grid; grid-template-columns: var(--side) minmax(0, 1fr) var(--toc); max-width: 1320px; margin: 0 auto; }
.side { position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 53px); overflow-y: auto; padding: 20px 14px 40px 20px; border-right: 1px solid var(--rule); }
.side-meta { font: 400 12px/1.5 var(--font-mono); color: var(--muted); margin: 0 0 18px 8px; }
.cat { margin-bottom: 16px; }
.cat-title { font: 600 11px/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 4px 8px; }
.cat ul { list-style: none; margin: 0; padding: 0; }
.cat a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.4; }
.cat a:hover { background: var(--soft); }
.cat a[aria-current="page"] { background: var(--mark); color: var(--link); font-weight: 500; }
.new { font: 500 10px/1.6 var(--font-mono); color: var(--link); text-transform: uppercase; letter-spacing: 0.05em; flex: none; }

main { min-width: 0; padding: 36px 48px 80px; }
.crumb { font: 500 12px/1.4 var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 6px; }
.page-title { font: italic 600 44px/1.08 var(--font-display); margin: 0 0 10px; text-wrap: balance; }
.page-meta { font: 400 12px/1.5 var(--font-mono); color: var(--muted); margin: 0 0 30px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.prose { max-width: 70ch; }
.prose h2 { font: 600 21px/1.3 var(--font-body); margin: 2.2em 0 0.6em; text-wrap: balance; scroll-margin-top: 80px; }
.prose h3 { font: 600 16px/1.4 var(--font-body); margin: 1.8em 0 0.4em; scroll-margin-top: 80px; }
.prose p, .prose ul, .prose ol { margin: 0 0 1em; }
.prose li { margin: 0.25em 0; }
.prose strong { font-weight: 600; }
.prose blockquote { margin: 1.2em 0; padding: 12px 16px; border-left: 3px solid var(--ink); background: var(--soft); border-radius: 0 6px 6px 0; }
.prose blockquote p:last-child { margin: 0; }
.prose code { font: 400 0.88em var(--font-mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
.table-wrap { overflow-x: auto; margin: 0 0 1.4em; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.prose th { text-align: left; font-weight: 600; background: var(--soft); }
.prose th, .prose td { padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.prose tr:last-child td { border-bottom: 0; }
.figure { margin: 1.4em 0; padding: 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); overflow-x: auto; }
.figure svg { display: block; width: 100%; min-width: 560px; height: auto; color: var(--ink); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 48px; max-width: 70ch; }
.pager a { display: block; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; text-decoration: none; color: var(--ink); min-width: 0; }
.pager a:hover { border-color: var(--ink); }
.pager small { display: block; font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.pager .next { text-align: right; grid-column: 2; }
.log-entry { padding: 0 0 22px; margin: 0 0 22px; border-bottom: 1px solid var(--rule); }
.log-date { font: 500 12px var(--font-mono); color: var(--muted); }
.log-entry h2 { margin: 4px 0 8px; font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips a { font: 400 12px var(--font-mono); padding: 2px 8px; border: 1px solid var(--rule); border-radius: 999px; text-decoration: none; }
.results { list-style: none; margin: 0; padding: 0; max-width: 70ch; }
.results li { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.results a { font-weight: 600; text-decoration: none; }
.results p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.results mark { background: var(--mark); color: var(--ink); border-radius: 3px; padding: 0 2px; }

.toc { position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); align-self: start; padding: 40px 20px 40px 8px; max-height: calc(100vh - 53px); overflow-y: auto; }
.toc-title { font: 600 11px/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
.toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
.toc a { display: block; padding: 3px 0 3px 12px; font-size: 13px; line-height: 1.4; color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--ink); }
.toc .l3 a { padding-left: 24px; font-size: 12.5px; }

.state { max-width: 52ch; padding: 40px 0; }
.state .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); margin-bottom: 18px; }
@media (prefers-reduced-motion: no-preference) { .state .dot { animation: pulse 1.8s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: 0.25; } }

@media (max-width: 1100px) { .layout { grid-template-columns: var(--side) minmax(0, 1fr); } .toc { display: none; } }
@media (max-width: 780px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .brand-sub { display: none; }
  .side { display: none; position: fixed; inset: calc(53px + env(safe-area-inset-top, 0px)) 0 0 0; height: auto; z-index: 15; background: var(--bg); border-right: 0; }
  body.nav-open .side { display: block; }
  main { padding: 24px 16px 64px; }
  .page-title { font-size: 34px; }
  .pager { grid-template-columns: 1fr; }
  .pager .next { grid-column: 1; }
}
</style>

<header class="top">
  <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="side">Índice</button>
  <a class="brand" href="#inicio">
    <span class="brand-mark" aria-hidden="true"><span></span></span>
    <span class="brand-name">El Punto</span>
    <span class="brand-sub">Libro de diseño</span>
  </a>
  <label class="search">
    <svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar en la documentación" aria-label="Buscar en la documentación" autocomplete="off">
  </label>
</header>

<div class="layout">
  <nav class="side" id="side" aria-label="Categorías">
    <p class="side-meta" id="side-meta">Cargando…</p>
    <div id="nav"></div>
  </nav>
  <main id="main">
    <div class="state" id="state">
      <div class="dot"></div>
      <p class="page-title">Cargando el libro</p>
      <p>Si las páginas no aparecen en unos segundos, recargá.</p>
    </div>
  </main>
  <aside class="toc" id="toc" aria-label="En esta página"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(() => {
  const S = { cats: [], pages: [], log: [], meta: null, ready: { cats: false, pages: false } };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const fmtDate = iso => { if (!iso) return ""; const [y, m, d] = String(iso).split("-").map(Number); return `${d} ${MONTHS.at(m - 1)} ${y}`; };
  const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const LOG_ID = "registro-de-cambios";

  marked.setOptions({ gfm: true, breaks: false });
  const md = text => {
    const html = DOMPurify.sanitize(marked.parse(String(text || "")), { ADD_ATTR: ["target"] });
    const box = document.createElement("div");
    box.innerHTML = html;
    box.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });
    box.querySelectorAll("svg").forEach(s => { if (!s.closest(".figure")) { const w = document.createElement("div"); w.className = "figure"; s.replaceWith(w); w.appendChild(s); } });
    box.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    const used = new Set();
    box.querySelectorAll("h2, h3").forEach(h => { let id = slug(h.textContent) || "seccion"; while (used.has(id)) id += "-2"; used.add(id); h.id = id; });
    return box;
  };

  const ordered = () => {
    const out = [];
    for (const c of S.cats) for (const p of S.pages.filter(p => p.cat === c.id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))) out.push(p);
    return out;
  };
  const latest = () => S.log.length ? S.log.at(0).date : (S.meta && S.meta.updated) || "";

  // ── navegación
  const renderNav = current => {
    const fresh = new Set((S.log.at(0) || {}).pages || []);
    $("side-meta").textContent = S.meta ? `Versión ${S.meta.version || "—"} · actualizado ${fmtDate(S.meta.updated)}` : (S.cats.length ? "" : "Sin páginas todavía");
    const nav = $("nav"); nav.textContent = "";
    for (const c of S.cats) {
      const pages = S.pages.filter(p => p.cat === c.id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      const isProd = c.id === "produccion";
      if (!pages.length && !isProd) continue;
      const sec = document.createElement("section"); sec.className = "cat";
      sec.innerHTML = `<p class="cat-title">${esc(c.title)}</p><ul></ul>`;
      const ul = sec.querySelector("ul");
      const items = pages.map(p => ({ id: p.id, title: p.title, fresh: fresh.has(p.id) }));
      if (isProd) items.push({ id: LOG_ID, title: "Registro de cambios", fresh: false });
      for (const it of items) {
        const li = document.createElement("li");
        li.innerHTML = `<a href="#${esc(it.id)}"${it.id === current ? ' aria-current="page"' : ""}><span>${esc(it.title)}</span>${it.fresh ? '<span class="new">nuevo</span>' : ""}</a>`;
        ul.appendChild(li);
      }
      nav.appendChild(sec);
    }
  };

  const renderToc = root => {
    const toc = $("toc"); toc.textContent = "";
    const hs = root ? [...root.querySelectorAll("h2, h3")] : [];
    if (hs.length < 2) return;
    toc.innerHTML = `<p class="toc-title">En esta página</p><ul></ul>`;
    const ul = toc.querySelector("ul");
    for (const h of hs) {
      const li = document.createElement("li"); li.className = h.tagName === "H3" ? "l3" : "l2";
      const a = document.createElement("a"); a.href = "#" + current() ; a.textContent = h.textContent;
      a.addEventListener("click", e => { e.preventDefault(); h.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); });
      li.appendChild(a); ul.appendChild(li);
    }
  };

  const current = () => { const h = location.hash.slice(1); return h && h !== "inicio" ? h : (ordered().at(0) || {}).id || ""; };

  // ── páginas
  const renderPage = () => {
    const main = $("main"), id = current(), q = $("q").value.trim();
    renderNav(id);
    if (q) return renderSearch(q);
    if (!S.ready.pages || !S.ready.cats) return;
    if (id === LOG_ID) return renderLog();
    const list = ordered(), i = list.findIndex(p => p.id === id), p = list.at(i);
    if (i < 0 || !p) {
      main.innerHTML = `<div class="state"><div class="dot"></div><p class="page-title">${list.length ? "Esta página no existe" : "El libro está vacío"}</p><p>${list.length ? 'Puede que se haya movido. <a href="#inicio">Volver al inicio</a>.' : "Cuando se carguen las primeras páginas van a aparecer acá."}</p></div>`;
      renderToc(null); return;
    }
    const cat = S.cats.find(c => c.id === p.cat);
    main.innerHTML = `<p class="crumb">${esc(cat ? cat.title : "")}</p><h1 class="page-title">${esc(p.title)}</h1><p class="page-meta">Actualizado el ${esc(fmtDate(p.updated))}</p><article class="prose" id="prose"></article><nav class="pager" aria-label="Páginas vecinas"></nav>`;
    const body = md(p.body); $("prose").append(...body.childNodes);
    const prev = list.at(i - 1), next = list.at(i + 1), pager = main.querySelector(".pager");
    if (i > 0 && prev) pager.insertAdjacentHTML("beforeend", `<a class="prev" href="#${esc(prev.id)}"><small>Anterior</small>${esc(prev.title)}</a>`);
    if (next) pager.insertAdjacentHTML("beforeend", `<a class="next" href="#${esc(next.id)}"><small>Siguiente</small>${esc(next.title)}</a>`);
    renderToc($("prose"));
    document.title = `${p.title} · El Punto`;
  };

  const renderLog = () => {
    const main = $("main");
    main.innerHTML = `<p class="crumb">Producción</p><h1 class="page-title">Registro de cambios</h1><p class="page-meta">Cada paso del proyecto, del más reciente al más antiguo</p><div class="prose" id="prose"></div>`;
    const box = $("prose");
    if (!S.log.length) { box.innerHTML = "<p>Todavía no hay cambios registrados.</p>"; renderToc(null); return; }
    for (const e of S.log) {
      const div = document.createElement("div"); div.className = "log-entry";
      div.innerHTML = `<p class="log-date">${esc(fmtDate(e.date))}${e.version ? " · versión " + esc(e.version) : ""}</p><h2>${esc(e.title)}</h2>`;
      if (e.items && e.items.length) { const ul = document.createElement("ul"); for (const it of e.items) { const li = document.createElement("li"); li.textContent = it; ul.appendChild(li); } div.appendChild(ul); }
      const linked = (e.pages || []).map(pid => S.pages.find(p => p.id === pid)).filter(Boolean);
      if (linked.length) { const ch = document.createElement("div"); ch.className = "chips"; ch.innerHTML = linked.map(p => `<a href="#${esc(p.id)}">${esc(p.title)}</a>`).join(""); div.appendChild(ch); }
      box.appendChild(div);
    }
    renderToc(null);
    document.title = "Registro de cambios · El Punto";
  };

  const renderSearch = q => {
    const main = $("main"), terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const strip = s => String(s || "").replace(/<[^>]+>/g, " ").replace(/[#*|>`_\-]+/g, " ").replace(/\s+/g, " ");
    const hits = ordered().map(p => {
      const text = strip(p.body), hay = (p.title + " " + text).toLowerCase();
      if (!terms.every(t => hay.includes(t))) return null;
      const at = Math.max(0, text.toLowerCase().indexOf(terms.at(0)) - 60);
      let snip = esc((at > 0 ? "…" : "") + text.slice(at, at + 180) + "…");
      for (const t of terms) snip = snip.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
      return { p, snip, score: p.title.toLowerCase().includes(terms.at(0)) ? 0 : 1 };
    }).filter(Boolean).sort((a, b) => a.score - b.score);
    main.innerHTML = `<p class="crumb">Búsqueda</p><h1 class="page-title">${hits.length} ${hits.length === 1 ? "resultado" : "resultados"}</h1><p class="page-meta">para “${esc(q)}”</p><ul class="results">${hits.map(h => `<li><a href="#${esc(h.p.id)}">${esc(h.p.title)}</a><p>${h.snip}</p></li>`).join("")}</ul>`;
    main.querySelectorAll(".results a").forEach(a => a.addEventListener("click", () => { $("q").value = ""; }));
    renderToc(null);
  };

  // ── interacción
  addEventListener("hashchange", () => { document.body.classList.remove("nav-open"); $("menu-btn").setAttribute("aria-expanded", "false"); renderPage(); scrollTo(0, 0); });
  let t = 0; $("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(renderPage, 160); });
  $("menu-btn").addEventListener("click", () => { const open = document.body.classList.toggle("nav-open"); $("menu-btn").setAttribute("aria-expanded", String(open)); });

  // ── datos
  const showError = msg => { $("main").innerHTML = `<div class="state"><div class="dot"></div><p class="page-title">No se pudo abrir el libro</p><p>${esc(msg)}</p></div>`; $("side-meta").textContent = ""; };
  (async () => {
    const db = await (window.claude?.use ? window.claude.use("db") : Promise.resolve(null));
    if (!db) {
      // fuera de claude.ai (por ejemplo, en Vercel): el libro viene en un JSON generado desde libro/
      try {
        const r = await fetch("/libro/datos/libro.json", { cache: "no-cache" });
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        S.cats = d.categories.sort((a, b) => a.order - b.order); S.pages = d.pages; S.log = d.changelog.sort((a, b) => b.order - a.order); S.meta = d.meta;
        S.ready.cats = S.ready.pages = true; renderPage();
      } catch (e) { showError("No se pudieron cargar las páginas del libro."); }
      return;
    }
    const fail = e => { if (e && (e.code === "revoked" || e.code === "not_granted")) showError("El acceso a la base de datos se interrumpió. Volvé a abrir el libro."); };
    db.collection("categories").orderBy("order").onSnapshot(s => { S.cats = s.docs.map(d => ({ id: d.id, ...d.data() })); S.ready.cats = true; renderPage(); }, fail);
    db.collection("pages").onSnapshot(s => { S.pages = s.docs.map(d => ({ id: d.id, ...d.data() })); S.ready.pages = true; renderPage(); }, fail);
    db.collection("changelog").orderBy("order", "desc").onSnapshot(s => { S.log = s.docs.map(d => ({ id: d.id, ...d.data() })); renderPage(); }, fail);
    db.doc("meta/site").onSnapshot(s => { S.meta = s.exists ? s.data() : null; renderNav(current()); }, fail);
  })();
})();
</script>

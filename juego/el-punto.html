  --vacio: #000000;
  --luz: #f2f1ec;

  /* margen de la muesca en celulares: el juego lo lee para ubicar lo que llevás */

  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; margin: 0; background: var(--vacio); color: var(--luz); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; user-select: none; }
</style>

<script>
(() => {

    "#.#,,,,,#,,,#c#,,,,#.<.....RRRR#,,,#RRR.#####.######.######.#",
    "#.#3,,,4#,,,#.#,,,,#.......RRRR#####RRR.#####.######.######.#",
    "#.###########.######.#####pRRRRRRRRRRRR.#####.######.######.#",
    "#S.....T....................................................#",
    "#############################################################"
  ];
  const LABERINTO = [
    "#######################",
    "#A.T..#.......#.......#",
    "#####.#.#####.#.#####.#",
    "#.....#.#...#...#...#.#",
    "#.#####.#.#.#####.#.#.#",
    "#.#.....#.#.......#...#",
    "#.#.#####.#########.###",
    "#.#.#...#.........#...#",
    "#.#.#.#.#########.###.#",
    "#...#.#.......#RR..T..#",
    "#####.#######.#.####$##",
    "#.....#.....#.........#",
    "#.#####.###.#.##.####.#",
    "#.#c....#...#.......#.#",
    "#.#######.#########.#.#",
    "#K..........#......k#.#",
    "#######################"
  ];
  const CAJAS = [
    "###################################",
    "###########.j.j.j.j.#riiiiirii#####",
    "###...#...#.........#iiriiiiii#####",
    "###...$.#.#.j.j.j.j.#riiiiriir#T..#",
    "#ZS..$.$..x.........P.iiriiiiix.fQ#",
    "###..$.#..#.j.j.j.j.#iiiiiiiir#...#",
    "###.#$.#..#.........#iiiiriiii#####",
    "###########.j.j.j.j.#ririiriii#####",
    "###################################"
  ];
  const CARTELES = {
    ciudad: {
      "7,46": "Lo que se ve no es todo lo que hay.",
      "8,33": "Mirá a los dos lados.",
      "30,40": "Acá nada te alcanza. Volvé cuando lo necesites.",
      "16,18": "Lo roto también se arregla.",
      "24,8": "Algunas paredes se suben. Hay que insistir.",
      "19,5": "Ahora ves lo que otros no ven.",
      "27,4": "Escuchá antes de pisar."
    },
    cajas: {
      "31,3": "Acá todo se ve. Lo difícil era otra cosa."
    },
    laberinto: {
      "3,1": "Lo que abre está donde nadie quiere ir.",
      "19,9": "Lo que encierra también protege."
    }
  };
  const ITEM_CH = { c: "chispa", p: "tabla", f: "fragmento", k: "llave", l: "libro", z: "zapatillas", e: "escudo", h: "sombrero", q: "barreta", o: "lente", a: "armazon" };
  const POWERS = ["libro", "zapatillas", "escudo", "sombrero", "barreta"];

  const parse = (name, rows) => {
    const w = { name, W: rows[0].length, H: rows.length, grid: rows.map(r => r.split("")), items: [], doors: new Map(), peds: [], clues: [], enemies: [], lanes: [], signs: [], alarm: [], calm: [], notes: [], boxes: [], cards: [] };
    for (let y = 0; y < w.H; y++) for (let x = 0; x < w.W; x++) {
      const ch = w.grid[y][x], key = x + "," + y;
      const door = (kind, need, consume) => w.doors.set(key, { x, y, kind, need, consume, open: false, openAt: -1e9, shakeAt: -1e9 });
      if (ITEM_CH[ch]) { w.items.push({ x, y, kind: ITEM_CH[ch] }); w.grid[y][x] = "."; continue; }
      switch (ch) {
        case "S": w.start = { x, y }; w.grid[y][x] = name === "cajas" ? "x" : "."; break;
        case "O": w.items.push({ x, y, kind: "lente", hidden: true }); w.grid[y][x] = "."; break;
        case "C": w.crisol = { x, y }; break;
        case "V": door("vitrina", "melodia", false); w.items.push({ x, y, kind: "sombrero" }); break;
        case "m": w.musicbox = { x, y, playedAt: -1e9 }; break;
        case "n": w.notes.push({ x, y, at: -1e9 }); break;
        case "Q": w.qportal = { x, y }; break;
        case "$": w.boxes.push({ x, y, x0: x, y0: y }); w.grid[y][x] = "."; break;
        case "j": w.cards.push({ x, y, state: "down" }); break;
        case "Z": w.reset = { x, y }; break;
        case "P": door("reja", "pares", false); break;
        case "H": door("casa", "llave", true); break;
        case "L": door("casa", "anteojos", true); break;
        case "E": door("reja", "orden", false); break;
        case "X": door("grieta", "fragmento", true); break;
        case "1": case "2": case "3": case "4": w.peds.push({ x, y, lit: false }); w.grid[y][x] = ","; break;
        case "M": w.goal = { x, y }; w.grid[y][x] = ","; break;
        case "A": w.portal = { x, y, shakeAt: -1e9 }; w.grid[y][x] = "."; break;
        case "K": w.clueAnchor = { x, y }; w.grid[y][x] = "."; break;
        case "T": w.signs.push({ x, y, text: CARTELES[name][key] || "", seenAt: -1, near: 0 }); break;
        case "!": w.alarm.push({ x, y }); break;
        case "R": w.calm.push({ x, y }); break;
      }
    }
    w.seen = new Float64Array(w.W * w.H).fill(-1e9);
    return w;
  };
  const city = parse("ciudad", CIUDAD);
  const lab = parse("laberinto", LABERINTO);
  const cajas = parse("cajas", CAJAS);
  cajas.lit = true;
  lab.enemies.push({ x: 13, y: 13, min: 13, max: 19, d: 1 }, { x: 21, y: 11, min: 15, max: 21, d: -1 });
  city.lanes.push(
    { y: 31, dir: 1, speed: 3.4, len: 2, cars: [2, 10, 18, 26, 34, 42, 50] },
    { y: 32, dir: -1, speed: 4.4, len: 3, cars: [5, 17, 29, 41, 53] }
  );
  // callejones sin salida del laberinto: suenan a "no es por aquí"
  {
    const special = new Set([...lab.items.map(i => i.x + "," + i.y), lab.portal.x + "," + lab.portal.y, lab.clueAnchor.x + "," + lab.clueAnchor.y, ...lab.signs.map(s => s.x + "," + s.y)]);
    for (let y = 1; y < lab.H - 1; y++) for (let x = 1; x < lab.W - 1; x++) {
      if (lab.grid[y][x] === "#" || special.has(x + "," + y)) continue;
      const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([a, b]) => lab.grid[y + b][x + a] !== "#").length;
      if (n === 1) lab.alarm.push({ x, y });
    }
  }
  const CITY_RETURN = { x: 6, y: 3 }, CAJAS_RETURN = { x: 3, y: 6 };

  // ═════════════════ Semilla propia de cada jugador ═════════════════
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  // una semilla nueva en cada partida: cambia el orden de las figuras, la melodía y las cartas
  const seed = ((Math.random() * 2147483647) | 0) || 7;
  const rng = (a => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; })(seed);
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const SHAPES = ["circulo", "cuadrado", "triangulo", "rombo"];
  city.peds.sort((a, b) => a.x - b.x);
  shuffle(SHAPES.slice()).forEach((s, i) => { city.peds[i].shape = s; });
  const order = shuffle(SHAPES.slice());
  const slots = shuffle([0, 1, 2, 3]);
  lab.clues = [0, 1, 2, 3].map(j => ({ x: lab.clueAnchor.x + j, y: lab.clueAnchor.y, shape: order[slots[j]], n: slots[j] + 1 }));
  // la melodía del sombrero: 5 notas sobre 4 baldosas, nunca la misma dos veces seguidas
  const PITCH = [392, 494, 587, 784];
  city.notes.sort((a, b) => a.x - b.x).forEach((n, i) => { n.i = i; });
  const melody = []; while (melody.length < 5) { const k = Math.floor(rng() * 4); if (k !== melody.at(-1)) melody.push(k); }
  // las cartas de memoria
  const SYMBOLS = ["circulo", "cuadrado", "triangulo", "rombo", "cruz", "estrella", "luna", "onda"];
  shuffle([...SYMBOLS, ...SYMBOLS]).forEach((sym, i) => { cajas.cards[i].sym = sym; });

  // ═════════════════════════ Estado ═════════════════════════
  const LIFT_MS = 1600, BASE_R = 1, SPARK_R = 0.5, ENEMY_MS = 260, MEM_MS = 3500, MEM_A = 0.22, CLIMB_MS = 750;
  let cur = city;
  const P = { x: city.start.x, y: city.start.y };
  const dp = { x: P.x, y: P.y };
  const inv = { fragmento: 0, llave: 0, lente: 0, armazon: 0, anteojos: 0, tabla: 0 };
  const powers = new Set();
  let stats = { trapped: 0, hits: 0, built: 0, crafted: 0, cajas1: false, hielo: false, escaped: false }, labAwake = false, labCalm = false, hunters = [], hunterClock = 0, shakeUntil = 0, chaseStep = 0, nextChase = 0;
  let shield = 0, stuck = false, zoomE = 0, climb = null, lift = null, slide = null, mseq = [], mCool = 0, flipped = [], hideAt = 0, stuckSince = 0, crafts = [], endGoneAt = 0, prev = { x: 0, y: 0 }, labOpen = false, seq = [], coolUntil = 0, startAt = 0, wonAt = 0, endShown = false;
  let awake = false, R = 0, targetR = 0, progress = 0, lastMove = 0, lastBump = 0, lastDeny = 0, invulnUntil = 0;
  let sparkFx = null, flash = 0, revealUntil = 0, dimUntil = 0, won = false, endGone = false, trans = null, visitedLab = false, readAt = -1;
  let badge = store("punto.insignia") === "1";
  const pickups = [], ghosts = [], builds = [];
  let enemyClock = 0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const moveMs = () => powers.has("zapatillas") ? 82 : 120;
  const has = k => inv[k] > 0;

  // ═════════════════════════ Sonido ═════════════════════════
  let ac = null, layers = null;
  const audio = () => {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume();
  };
  const tone = (f, dur, o = {}) => {
    if (!ac) return;
    const t0 = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.06, t0 + (o.attack || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  };
  const noiseBurst = (dur, freq, vol, delay = 0) => {
    if (!layers) return;
    const t0 = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = layers.noise;
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 1.2;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(ac.destination); src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  };
  const DRONES = { ciudad: [55, 82.4], laberinto: [58.3, 61.9], cajas: [98, 98.4] };
  const startLayers = () => {
    if (!ac || layers) return;
    const len = ac.sampleRate * 2, noise = ac.createBuffer(1, len, ac.sampleRate), d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const gain = v => { const g = ac.createGain(); g.gain.value = v; g.connect(ac.destination); return g; };
    const loop = () => { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; s.start(); return s; };
    // fondo de cada mundo
    const drone = gain(0.0001), dO = [0, 1].map(i => { const o = ac.createOscillator(); o.frequency.value = DRONES[cur.name][i]; o.connect(drone); o.start(); return o; });
    drone.gain.exponentialRampToValueAtTime(0.018, ac.currentTime + 4);
    // "algo está roto": chisporroteo
    const roto = gain(0); { const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2600; f.Q.value = 2.5; loop().connect(f).connect(roto); }
    // tránsito: motor grave
    const motor = gain(0); { const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380; loop().connect(f).connect(motor); }
    // "calma": refugio
    const calma = gain(0); [261.6, 329.6, 392, 523.3].forEach((fq, i) => { const o = ac.createOscillator(); o.frequency.value = fq; o.detune.value = (i - 1.5) * 4; const g = ac.createGain(); g.gain.value = i === 3 ? 0.4 : 1; o.connect(g).connect(calma); o.start(); });
    layers = { noise, drone, dO, roto, motor, calma, nextAlarm: 0, alarmHi: false, nextBeat: 0, nextCall: 0 };
  };
  const setDrone = name => {
    if (!layers) return;
    const t = ac.currentTime;
    layers.dO.forEach((o, i) => { o.frequency.setValueAtTime(o.frequency.value, t); o.frequency.linearRampToValueAtTime(DRONES[name][i], t + 1.5); });
  };
  const sfx = {
    wake: () => { tone(110, 1.8, { to: 220, vol: 0.05 }); tone(165, 1.8, { to: 330, vol: 0.03, delay: 0.2 }); },
    step: () => tone(1200, 0.025, { type: "triangle", vol: 0.008 }),
    bump: () => tone(70, 0.09, { type: "square", vol: 0.03 }),
    deny: () => { tone(92, 0.18, { type: "square", vol: 0.05 }); tone(138, 0.14, { type: "square", vol: 0.03, delay: 0.09 }); },
    splash: () => { noiseBurst(0.35, 900, 0.12); tone(420, 0.25, { to: 140, vol: 0.02 }); },
    build: () => [0, 0.13, 0.26].forEach(d => { tone(190, 0.07, { type: "square", vol: 0.05, delay: d }); noiseBurst(0.05, 1800, 0.08, d); }),
    scratch: () => noiseBurst(0.06, 3200 + Math.random() * 1200, 0.05),
    climbed: () => { tone(330, 0.2, { to: 660, vol: 0.04 }); },
    grow: () => { tone(130, 1.5, { to: 262, vol: 0.05 }); tone(196, 1.5, { to: 392, vol: 0.03, delay: 0.12 }); },
    spark: () => [1, 1.25, 1.5, 2].forEach((m, i) => tone(392 * m, 0.5, { vol: 0.04, delay: i * 0.07 })),
    pickup: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.9, { vol: 0.045, delay: i * 0.06, type: "triangle" })),
    power: () => { [392, 494, 587, 784].forEach((f, i) => tone(f, 1.4, { vol: 0.04, delay: i * 0.09 })); tone(98, 1.6, { vol: 0.04 }); },
    open: () => { tone(80, 0.5, { type: "sawtooth", to: 160, vol: 0.03 }); [196, 247, 294, 392].forEach((f, i) => tone(f, 2, { vol: 0.04, delay: 0.25 + i * 0.1 })); },
    ped: k => tone([392, 494, 587][k], 0.6, { vol: 0.06 }),
    wrong: () => tone(98, 0.5, { type: "sawtooth", to: 60, vol: 0.035 }),
    portal: () => { tone(160, 1.1, { to: 900, vol: 0.05 }); tone(240, 1.1, { to: 1350, vol: 0.03, delay: 0.05 }); },
    seal: () => { tone(700, 1.2, { to: 70, vol: 0.05, type: "triangle" }); tone(66, 1.4, { type: "sawtooth", vol: 0.03, delay: 0.8 }); },
    hit: () => { tone(55, 0.4, { type: "sawtooth", vol: 0.06, to: 30 }); tone(3000, 0.08, { type: "square", vol: 0.02 }); },
    shieldBreak: () => { tone(1800, 0.3, { to: 300, type: "triangle", vol: 0.05 }); noiseBurst(0.2, 4000, 0.08); },
    shieldBack: () => tone(880, 0.8, { to: 1320, vol: 0.035 }),
    lift: () => { [0, 0.1, 0.2].forEach(d => tone(220 - d * 300, 0.08, { type: "square", vol: 0.04, delay: d })); tone(300, 0.5, { to: 600, vol: 0.03, delay: 0.25 }); },
    note: i => tone(PITCH[i], 0.55, { type: "triangle", vol: 0.07 }),
    melody: () => melody.forEach((k, j) => tone(PITCH[k], 0.5, { type: "triangle", vol: 0.06, delay: 0.3 + j * 0.5 })),
    push: () => { noiseBurst(0.14, 420, 0.14); tone(85, 0.1, { type: "square", vol: 0.03 }); },
    slide: () => noiseBurst(0.18, 5200, 0.035),
    flip: k => tone(330 * Math.pow(2, k / 8), 0.35, { type: "triangle", vol: 0.05 }),
    match: () => [659, 880, 1175].forEach((f, i) => tone(f, 0.6, { vol: 0.04, delay: i * 0.08, type: "triangle" })),
    craft: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 1.2, { vol: 0.045, delay: i * 0.1 })); noiseBurst(0.3, 6000, 0.05); },
    rewind: () => { tone(900, 0.6, { to: 180, vol: 0.05, type: "triangle" }); noiseBurst(0.5, 2500, 0.05); },
    awaken: () => { tone(48, 1.8, { type: "sawtooth", to: 30, vol: 0.08 }); tone(36, 2.2, { type: "square", vol: 0.04, delay: 0.2 }); noiseBurst(1.2, 220, 0.2); },
    fast: () => { tone(300, 0.35, { to: 900, vol: 0.05 }); noiseBurst(0.25, 3000, 0.06); },
    slow: () => tone(700, 0.4, { to: 220, vol: 0.05 }),
    trapped: () => { [0, 0.12].forEach(d => tone(140, 0.12, { type: "square", vol: 0.06, delay: d })); tone(880, 0.9, { to: 440, vol: 0.04, delay: 0.3, type: "triangle" }); },
    win: () => [262, 330, 392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 2.6 - i * 0.2, { vol: 0.045, delay: i * 0.16 }))
  };

  // ═════════════════════════ Reglas ═════════════════════════
  const doorAt = (w, x, y) => w.doors.get(x + "," + y);
  const inside = (w, x, y) => x >= 0 && y >= 0 && x < w.W && y < w.H;

        if (dk < 8 && t > layers.nextCall) { const v = 0.035 * (1 - dk / 8); tone(1568, 0.8, { type: "triangle", vol: v }); tone(2093, 0.8, { type: "triangle", vol: v * 0.6, delay: 0.12 }); layers.nextCall = t + 1500; }
      }
      // música de persecución: bajo insistente, platillo y un arpegio que sube con la cercanía
      if (w === lab && labAwake && hunters.some(h => !h.trapped) && t > nextChase) {
        const dh = nearest(hunters), k = 0.45 + 0.55 * prox(dh, 9), i = chaseStep % 16;
        const BASS = [55, 0, 55, 0, 65.4, 0, 55, 0, 73.4, 0, 55, 0, 82.4, 0, 73.4, 65.4];
        if (BASS[i]) tone(BASS[i], 0.12, { type: "sawtooth", vol: 0.055 * k });
        noiseBurst(0.03, 7000, (i % 2 ? 0.02 : 0.035) * k);
        if (i % 4 === 0) tone([440, 523, 587, 659].at((chaseStep / 4) % 4), 0.1, { type: "triangle", vol: 0.025 * k });
        chaseStep++; nextChase = t + 125;
      }
      // el reloj de Cajas
      if (w === cajas && t > (layers.nextTick || 0)) { layers.tock = !layers.tock; tone(layers.tock ? 1900 : 1500, 0.02, { type: "square", vol: 0.008 }); layers.nextTick = t + 500; }
    }
  };

  // ═════════════════════════ Bucle ═════════════════════════
  let last = performance.now();
  const frame = t => {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (trans) {
      const e = t - trans.start;
      if (!trans.switched && e >= 450) {
        trans.switched = true; cur = trans.to; P.x = dp.x = trans.pos.x; P.y = dp.y = trans.pos.y;
        setDrone(cur.name);
        if (cur === lab && !visitedLab) { visitedLab = true; setTimeout(sfx.seal, 300); lab.portal.shakeAt = t + 700; }
      }
      if (e >= 1100) trans = null;
    } else if (slide) {
      if (t >= slide.next) { const s0 = slide; slide = null; tryMove(s0.dx, s0.dy, t, true); if (slide) slide.next = t + 55; }
    } else if (awake) {
      const k = pressed.length ? KEYS[pressed[pressed.length - 1]] : pointerDir();
      if (stuck && cur === cajas && !k && t - lastMove > 300) { if (!stuckSince) stuckSince = t; else if (t - stuckSince > 1600) resetRoom(t); }
      else stuckSince = 0;
      if (!k) climb = null;
      else if (t - lastMove >= moveMs()) tryMove(k[0], k[1], t);
      const onBuilt = cur === city && city.grid[P.y][P.x] === "=" && builds.some(b => b.x === P.x && b.y === P.y);
      if (k || !powers.has("barreta") || !onBuilt || t - lastMove < 250) lift = null;
      else if (!lift) lift = { x: P.x, y: P.y, start: t };
      else if (t - lift.start >= LIFT_MS) {
        city.grid[P.y][P.x] = "~"; builds.splice(builds.findIndex(b => b.x === P.x && b.y === P.y), 1);
        inv.tabla++; pickups.push({ kind: "tabla", x: P.x, y: P.y, t, w: city }); sfx.lift();
        P.x = prev.x; P.y = prev.y; lift = null; lastMove = t;
      }
    }
    if (hideAt && t >= hideAt) { flipped.forEach(c => { c.state = "down"; }); flipped = []; hideAt = 0; }
    {
      const ease = k => k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      zoomE = won && cur === city ? ease(clamp01((t - wonAt) / 3000)) * (1 - (endGone ? ease(clamp01((t - endGoneAt) / 1200)) : 0)) : 0;
    }
    enemyClock += dt * 1000;
    while (enemyClock >= ENEMY_MS) { enemyClock -= ENEMY_MS; stepEnemies(t); }
    hunterClock += dt * 1000;
    while (hunterClock >= HUNT_MS) { hunterClock -= HUNT_MS; stepHunters(t); }
    stepTraffic(dt, t);
    let tr = targetR;
    if (t < dimUntil) tr = Math.min(tr, 0.35);
    if ((t < revealUntil || zoomE > 0.02) && cur === city) tr = 120;
    const growing = sparkFx && t - sparkFx.t < 1600;
    R += (tr - R) * Math.min(1, dt * (t < revealUntil ? 0.9 : growing ? 1.6 : 3));
    const f = Math.min(1, dt * 16);
    dp.x += (P.x - dp.x) * f; dp.y += (P.y - dp.y) * f;
    flash = Math.max(0, flash - dt * 1.4);
    soundscape(t);
    draw(t);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  cv.focus();

  console.log("%c·", "font-size:28px;color:#f2f1ec;background:#000;padding:0 14px");
  console.log("No todo lo que existe está dentro del mapa.");
})();
</script>
